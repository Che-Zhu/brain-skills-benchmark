apiVersion: example.crossplane.io/v1
kind: AP
metadata:
  name: my-app
  namespace: apps
spec:
  crossplane:
    compositionRef:
      name: aps-deployment-ingress-go-templating
  input:
    image: ghcr.io/example/my-app:prepare-abcdef1
  network:
    privatePort: 3000
  resource:
    replicaStrategy:
      type: fixed
      fixed:
        replicas: 1
