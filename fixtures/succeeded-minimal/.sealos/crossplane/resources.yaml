apiVersion: example.crossplane.io/v1
kind: AP
metadata:
  name: my-app
  namespace: apps
  labels:
    region: example.com
spec:
  crossplane:
    compositionRef:
      name: aps-deployment-ingress-go-templating
  name: my-app
  input:
    image: ghcr.io/example/my-app:prepare-abcdef1
    imagePullPolicy: Always
    network:
      privatePort: 3000
      platformAddresses:
        - id: pa_2d4ffba83fd9
          port: 3000
    probes:
      startup:
        httpGet:
          path: /
          port: 3000
        failureThreshold: 30
      liveness:
        httpGet:
          path: /
          port: 3000
        initialDelaySeconds: 15
        failureThreshold: 3
      readiness:
        httpGet:
          path: /
          port: 3000
        initialDelaySeconds: 5
        failureThreshold: 3
  resource:
    replicaStrategy:
      type: fixed
      fixed:
        replicas: 1
    requests:
      cpu: 200m
      memory: 204Mi
    limits:
      cpu: 2000m
      memory: 2048Mi
  projectName: my-app

